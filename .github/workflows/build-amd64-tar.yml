name: Build AMD64 Docker Tar

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  build-tar:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read application version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_SLUG="${VERSION//./-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_slug=$VERSION_SLUG" >> "$GITHUB_OUTPUT"

      - name: Build AMD64 Docker tarball
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t finance-dashboard:${{ steps.version.outputs.version }} \
            -o type=docker,dest=finance-dashboard-amd64-${{ steps.version.outputs.version_slug }}.tar \
            .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-dashboard-amd64-${{ steps.version.outputs.version_slug }}
          path: finance-dashboard-amd64-${{ steps.version.outputs.version_slug }}.tar
          if-no-files-found: error
