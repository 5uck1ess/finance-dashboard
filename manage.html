<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Investments - Finance Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/tailwind.generated.css" />
    <style>
      :root {
        --manage-bg: #f4efe6;
        --manage-accent: #f8d9c4;
        --manage-panel: rgba(255, 251, 246, 0.88);
        --manage-border: rgba(148, 163, 184, 0.16);
        --manage-shadow: 0 24px 64px rgba(15, 23, 42, 0.08);
      }

      html.dark {
        --manage-bg: #0f172a;
        --manage-accent: #1e293b;
        --manage-panel: rgba(15, 23, 42, 0.8);
        --manage-border: rgba(148, 163, 184, 0.14);
        --manage-shadow: 0 32px 90px rgba(2, 6, 23, 0.48);
      }

      body.manage-shell {
        background:
          radial-gradient(circle at top left, rgba(251, 191, 36, 0.16), transparent 24%),
          radial-gradient(circle at top right, rgba(96, 165, 250, 0.18), transparent 22%),
          linear-gradient(180deg, var(--manage-accent), var(--manage-bg) 38%);
      }

      .manage-nav,
      .manage-panel,
      .manage-float {
        background: var(--manage-panel);
        border: 1px solid var(--manage-border);
        backdrop-filter: blur(16px);
        box-shadow: var(--manage-shadow);
      }

      .manage-kicker {
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: #7c8698;
      }

      html.dark .manage-kicker {
        color: #94a3b8;
      }

      /* Prevent horizontal overflow on mobile */
      html,
      body {
        overflow-x: hidden;
      }
    </style>
    <link rel="stylesheet" href="/css/terminal.css" />
  </head>

  <body
    class="manage-shell bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200"
  >
    <nav class="manage-nav terminal-rail" aria-label="Primary navigation">
      <div class="terminal-rail-inner">
        <div class="terminal-rail-layout">
          <div class="terminal-rail-primary">
            <div class="terminal-brand">
              <span class="terminal-brand-mark"><i class="fas fa-chart-line" aria-hidden="true"></i></span>
              <span class="terminal-brand-copy"><strong>FIN</strong><small>Terminal</small></span>
            </div>
            <div class="terminal-nav-links">
              <a href="/">
                <i class="fas fa-border-all" aria-hidden="true"></i><span>Overview</span><small>01</small>
              </a>
              <a href="/manage.html" class="is-active">
                <i class="fas fa-sliders" aria-hidden="true"></i><span>Manage</span><small>02</small>
              </a>
            </div>
          </div>
          <div class="terminal-rail-actions">
            <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle dark mode">
              <i class="fas fa-moon" aria-hidden="true"></i><span>Theme</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="terminal-main manage-main max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <header class="manage-panel rounded-[1.2rem] sm:rounded-[2rem] px-4 py-5 sm:px-8 sm:py-7 mb-8">
        <div class="manage-kicker mb-3">Watchlist Control Room</div>
        <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">Manage Investments</h1>
        <p class="mt-3 text-gray-600 dark:text-gray-400 max-w-2xl leading-7">
          Add, remove, and organize your stocks, cryptocurrencies, and ETFs
        </p>
      </header>

      <!-- Add New Investment -->
      <section
        class="manage-panel bg-white dark:bg-gray-800 rounded-[1.2rem] sm:rounded-[1.75rem] shadow-sm border border-gray-200 dark:border-gray-700 p-4 sm:p-7 mb-8"
      >
        <h2 class="text-lg font-medium text-gray-900 dark:text-white mb-4">Add New Investment</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Symbol</label>
            <div class="flex">
              <input
                type="text"
                id="symbol-input"
                placeholder="e.g., AAPL"
                class="flex-1 rounded-l-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-blue-500 focus:border-blue-500 text-sm"
              />
              <select
                id="category-select"
                class="rounded-r-lg border-l-0 border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-blue-500 focus:border-blue-500 text-sm"
              >
                <option value="auto">Auto</option>
                <option value="stock">Stock</option>
                <option value="crypto">Crypto</option>
                <option value="etf">ETF</option>
              </select>
            </div>
          </div>
          <div class="flex gap-2">
            <div class="flex-1">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Shares</label>
              <input
                type="number"
                id="shares-input"
                placeholder="Optional"
                class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-blue-500 focus:border-blue-500 text-sm"
              />
            </div>
            <div class="flex-1">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cost Basis</label>
              <input
                type="number"
                id="cost-basis-input"
                placeholder="Optional"
                class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-blue-500 focus:border-blue-500 text-sm"
              />
            </div>
          </div>
        </div>

        <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-between sm:items-center">
          <div class="flex flex-wrap gap-x-3 gap-y-2">
            <input type="file" id="import-file" accept=".json,application/json" class="hidden" />
            <button
              id="upload-btn"
              class="text-sm text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
              aria-label="Restore dashboard from JSON backup"
            >
              <i class="fas fa-upload mr-1" aria-hidden="true"></i> Restore JSON
            </button>
            <button
              id="export-btn"
              class="text-sm text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
              aria-label="Export investments to file"
            >
              <i class="fas fa-download mr-1" aria-hidden="true"></i> Export
            </button>
            <button
              id="reset-data-btn"
              class="text-sm text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors"
              aria-label="Reset all local data"
            >
              <i class="fas fa-rotate-left mr-1" aria-hidden="true"></i> Reset
            </button>
          </div>
          <button
            id="add-btn"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center w-full sm:w-auto"
          >
            <i class="fas fa-plus mr-2"></i> Add Investment
          </button>
        </div>
      </section>

      <!-- Lists -->
      <div class="space-y-8">
        <!-- Stocks -->
        <section class="manage-panel rounded-[1.5rem] p-5 sm:p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white flex items-center">
              <i class="fas fa-chart-line mr-2 text-blue-500"></i> Stocks (<span id="stocks-count">0</span>)
            </h2>
          </div>
          <div id="stocks-list" class="space-y-2">
            <!-- Items -->
          </div>
        </section>

        <!-- Crypto -->
        <section class="manage-panel rounded-[1.5rem] p-5 sm:p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white flex items-center">
              <i class="fab fa-bitcoin mr-2 text-yellow-500"></i> Crypto (<span id="crypto-count">0</span>)
            </h2>
          </div>
          <div id="crypto-list" class="space-y-2">
            <!-- Items -->
          </div>
        </section>

        <!-- ETFs -->
        <section class="manage-panel rounded-[1.5rem] p-5 sm:p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white flex items-center">
              <i class="fas fa-layer-group mr-2 text-purple-500"></i> ETFs (<span id="etf-count">0</span>)
            </h2>
          </div>
          <div id="etf-list" class="space-y-2">
            <!-- Items -->
          </div>
        </section>
      </div>

      <!-- Bulk Actions (Sticky Bottom) -->
      <div
        class="manage-float fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[calc(100%-2rem)] max-w-md bg-white dark:bg-gray-800 shadow-lg border border-gray-200 dark:border-gray-700 rounded-full px-4 sm:px-6 py-3 flex items-center justify-center space-x-3 sm:space-x-4 z-40"
      >
        <button
          id="select-all-btn"
          class="text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors whitespace-nowrap"
        >
          Select All
        </button>
        <div class="h-4 w-px bg-gray-300 dark:bg-gray-600 flex-shrink-0"></div>
        <button
          id="deselect-all-btn"
          class="text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors whitespace-nowrap"
        >
          Deselect
        </button>
        <div class="h-4 w-px bg-gray-300 dark:bg-gray-600 flex-shrink-0"></div>
        <button
          id="delete-selected-btn"
          class="text-xs sm:text-sm font-medium text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors flex items-center whitespace-nowrap"
        >
          <i class="fas fa-trash mr-1 sm:mr-2"></i> Delete
        </button>
      </div>
    </main>

    <footer class="max-w-5xl mx-auto px-4 pb-8 sm:px-6 lg:px-8">
      <div
        class="flex flex-col gap-2 border-t border-slate-200/70 pt-5 text-xs text-slate-500 dark:border-slate-800 dark:text-slate-400 sm:flex-row sm:items-center sm:justify-between"
      >
        <span>Finance Dashboard v6.0.2</span>
        <span>&copy; 2026</span>
      </div>
    </footer>

    <script type="module" src="/js/manage.js"></script>
  </body>
</html>
